services:
  postgres:
    image: postgres:16-alpine
    container_name: terrahunt-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: terrahunt
      POSTGRES_PASSWORD: terrahunt_dev_password
      POSTGRES_DB: terrahunt
    ports:
      - "5432:5432"
    volumes:
      - terrahunt_pgdata_dev:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrahunt -d terrahunt"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  terrahunt_pgdata_dev:
